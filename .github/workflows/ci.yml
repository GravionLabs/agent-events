name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: "26"
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      # schema lint, fixtures, validator tests and $id check
      - run: pnpm test
  cli:
    # the published package runs from compiled dist/: the oldest supported LTS and the development version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ matrix.node }}
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node dist/cli.js validate "fixtures/events/valid/*.jsonl"
      # an invalid fixture must fail; guards against the CLI silently skipping main() (#63)
      - run: |
          set +e
          node dist/cli.js validate fixtures/events/invalid/bad-tone.jsonl
          code=$?
          test "$code" -eq 1
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the Action with defaults (no version input)
      - uses: ./
        with:
          files: fixtures/events/valid/*.jsonl
