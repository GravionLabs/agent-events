name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 brings the tags and the full history that determine-version needs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm test
      - name: Determine the version from the conventional commits
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          # below 1.0 the repository's own GitVersion.yml applies: breaking changes raise the minor version
          conventional-commits: 'false'
          gitversion-config-file: GitVersion.yml
      # Writes the version into package.json and package-lock.json and regenerates CHANGELOG.md
      # in one [skip ci] commit on main, tags that commit and creates the release (skipped when it
      # exists, so a re-run is safe). close-issues stays on: the job has issues: write and
      # pull-requests: read.
      - name: Tag and create the GitHub release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          version: ${{ steps.version.outputs.npm-version }}
          cliff-config: cliff.toml
          update-changelog: "true"
          version-command: npm version "$VERSION" --no-git-tag-version --allow-same-version
          recreate-branch: release/next
      - name: Attach the schemas and the npm tarball, built from the tagged version commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.npm-version }}
        run: |
          TAG="v$VERSION"
          git fetch --tags --force origin
          git checkout --detach "refs/tags/$TAG"
          npm ci
          npm pack --pack-destination "$RUNNER_TEMP"
          gh release upload "$TAG" --clobber schema/v0/*.json "$RUNNER_TEMP/agent-events-$VERSION.tgz"
