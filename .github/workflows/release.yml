name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
      - run: npm ci
      - run: npm test
      - name: Create GitHub release with the schemas as assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node src/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" schema/v0/*.json \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
