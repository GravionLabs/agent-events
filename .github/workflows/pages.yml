# Builds site/ with VitePress and deploys it to GitHub Pages (reusable workflow of GravionLabs/ci).
# Only site/ is published; docs/adr and internal specs never are.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "schema/**"
      - "SPEC.md"
      - "docs/**"
      - "bindings/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: GravionLabs/ci/.github/workflows/vitepress-pages.yml@v1
    with:
      site-path: site
      package-manager: npm
      deploy: ${{ github.event_name != 'pull_request' }}
